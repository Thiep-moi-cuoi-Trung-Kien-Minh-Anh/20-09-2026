<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO cơ bản (nội dung động sẽ được script.js đồng bộ từ config.js) -->
  <title>Kiên &amp; Người Thương | Thiệp Cưới Online</title>
  <meta name="description" content="Trân trọng kính mời bạn đến chung vui trong ngày cưới của chúng tôi." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Kiên & Người Thương | Thiệp Cưới Online" />
  <meta property="og:description" content="Trân trọng kính mời bạn đến chung vui trong ngày cưới của chúng tôi." />

  <!-- Preconnect + Google Fonts: Playfair Display, Cormorant Garamond, Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="invitation-locked">
  <!-- Nếu trình duyệt tắt JavaScript, mở khoá cuộn trang ngay lập tức
       để người dùng vẫn xem được toàn bộ nội dung -->
  <noscript>
    <style>
      body.invitation-locked { overflow: visible !important; height: auto !important; }
      .welcome-screen { position: relative !important; }
    </style>
  </noscript>

  <!-- ==========================================================
       LOADING SCREEN — ẩn tự động khi trang tải xong (script.js)
  =========================================================== -->
  <div id="loadingScreen" class="loading-screen" aria-hidden="true">
    <svg class="loading-screen__heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 21s-6.7-4.35-9.33-8.09C.86 10.6 1 7.42 3.3 5.6a5.5 5.5 0 0 1 7.2.5L12 7.5l1.5-1.4a5.5 5.5 0 0 1 7.2-.5c2.3 1.82 2.44 5 .63 7.31C18.7 16.65 12 21 12 21z"/>
    </svg>
    <p class="loading-screen__text">Đang mở thiệp mời...</p>
  </div>

  <!-- ==========================================================
       SCROLL PROGRESS BAR — cập nhật width theo % cuộn trang
  =========================================================== -->
  <div class="scroll-progress" aria-hidden="true">
    <div class="scroll-progress__bar" id="scrollProgressBar"></div>
  </div>

  <!-- ==========================================================
       THEME TOGGLE — chuyển đổi Dark / Light Mode
  =========================================================== -->
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Chuyển chế độ sáng/tối">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>

  <!-- ==========================================================
       NỘI DUNG CHÍNH — các section sẽ được thêm dần ở M1-M9
  =========================================================== -->
  <main id="mainContent">
    <!-- ==========================================================
         M1 — WELCOME SCREEN (bìa thiệp)
         Khoá cuộn trang (body.invitation-locked) cho tới khi bấm
         "Mở Thiệp". Ảnh nền được cấu hình ở config.js (welcome.backgroundImage);
         nếu chưa có ảnh, nền sẽ tự dùng gradient thay thế (xem script.js).
    =========================================================== -->
    <section id="welcome" class="welcome-screen" aria-label="Trang bìa thiệp cưới">
      <div class="welcome-screen__bg" aria-hidden="true"></div>
      <div class="welcome-screen__photo" aria-hidden="true"></div>
      <div class="welcome-screen__overlay" aria-hidden="true"></div>

      <div class="welcome-screen__content">
        <p class="welcome-screen__eyebrow" id="welcomeEyebrow">Trân trọng kính mời</p>

        <div class="welcome-screen__ornament" aria-hidden="true">❧</div>

        <h1 class="welcome-screen__names">
          <span id="welcomeGroomName">Chú Rể</span>
          <span class="welcome-screen__amp font-script">&amp;</span>
          <span id="welcomeBrideName">Cô Dâu</span>
        </h1>

        <p class="welcome-screen__date font-script" id="welcomeDate">12 . 12 . 2026</p>

        <button id="openInvitationBtn" class="open-invitation-btn" type="button">
          <svg class="open-invitation-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="2.5" y="5" width="19" height="14" rx="1.5" />
            <path d="M3 6.5l9 6.5 9-6.5" />
          </svg>
          <span id="welcomeOpenLabel">Mở Thiệp</span>
        </button>
      </div>

      <div class="welcome-screen__scroll-hint" aria-hidden="true">&#8964;</div>
    </section>

    <!-- ==========================================================
         M2 — GIỚI THIỆU (ảnh cưới + lời chào + câu chuyện)
    =========================================================== -->
    <section id="about" class="about-section">
      <div class="container about-section__inner">
        <div class="about-section__media reveal">
          <img id="aboutPhoto" class="about-section__photo" alt="Ảnh cưới" loading="lazy" />
          <div class="about-section__photo-fallback" aria-hidden="true">&#10084;</div>
        </div>
        <div class="about-section__text reveal">
          <span class="section-eyebrow">Giới thiệu</span>
          <p class="about-section__greeting font-script" id="aboutGreeting"></p>
          <div class="about-section__story" id="aboutStory"></div>
        </div>
      </div>
    </section>

    <!-- ==========================================================
         M2 — COUNTDOWN (đếm ngược thời gian thực đến ngày cưới)
    =========================================================== -->
    <section id="countdown-section" class="countdown-section">
      <div class="container countdown-section__inner reveal">
        <span class="section-eyebrow">Đếm ngược</span>
        <h2 class="countdown-section__title" id="countdownTitle">Ngày trọng đại sẽ đến trong</h2>

        <div class="countdown" id="countdown" role="timer" aria-live="polite">
          <div class="countdown__unit">
            <span class="countdown__value" id="cdDays">00</span>
            <span class="countdown__label" data-unit="days">Ngày</span>
          </div>
          <div class="countdown__unit">
            <span class="countdown__value" id="cdHours">00</span>
            <span class="countdown__label" data-unit="hours">Giờ</span>
          </div>
          <div class="countdown__unit">
            <span class="countdown__value" id="cdMinutes">00</span>
            <span class="countdown__label" data-unit="minutes">Phút</span>
          </div>
          <div class="countdown__unit">
            <span class="countdown__value" id="cdSeconds">00</span>
            <span class="countdown__label" data-unit="seconds">Giây</span>
          </div>
        </div>

        <p class="countdown__completed" id="countdownCompleted" hidden></p>
      </div>
    </section>

    <!-- ==========================================================
         M3 — TIMELINE (các mốc: Gặp nhau, Yêu nhau, Đính hôn, Ngày cưới)
         Danh sách được sinh động từ config.timeline.milestones (script.js)
    =========================================================== -->
    <section id="timeline" class="timeline-section">
      <div class="container">
        <div class="timeline-section__heading reveal">
          <span class="section-eyebrow">Hành trình</span>
          <h2 id="timelineTitle">Chuyện tình của chúng tôi</h2>
        </div>
        <ol class="timeline" id="timelineList"></ol>
      </div>
    </section>

    <!-- ==========================================================
         M4 — THÔNG TIN LỄ CƯỚI (Lễ nhà trai / Lễ nhà gái / Tiệc cưới)
         Danh sách card sinh từ config.events.items (script.js). Bản đồ +
         nút "Chỉ đường" tự tạo từ trường "address", không cần lấy mã nhúng
         Google Maps thủ công.
    =========================================================== -->
    <section id="events" class="events-section">
      <div class="container">
        <div class="events-section__heading reveal">
          <span class="section-eyebrow">Lễ cưới</span>
          <h2 id="eventsTitle">Thông tin lễ cưới</h2>
        </div>
        <div class="events-grid" id="eventsGrid"></div>
      </div>
    </section>

    <!-- ==========================================================
         M5 — ALBUM ẢNH (Masonry + Lightbox)
         Danh sách ảnh sinh từ config.gallery.images (script.js). Ảnh dùng
         loading="lazy"; ảnh lỗi/chưa có sẽ tự hiện khung placeholder.
    =========================================================== -->
    <section id="gallery" class="gallery-section">
      <div class="container">
        <div class="gallery-section__heading reveal">
          <span class="section-eyebrow">Album</span>
          <h2 id="galleryTitle">Album ảnh</h2>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </section>

    <!-- ==========================================================
         M6 — RSVP (form xác nhận tham dự)
         Xem config.rsvp để cấu hình nội dung + endpoint kết nối Google
         Sheets (qua Google Apps Script Web App). Nếu chưa cấu hình,
         script.js sẽ lưu tạm phản hồi vào localStorage của trình duyệt.
    =========================================================== -->
    <section id="rsvp" class="rsvp-section">
      <div class="container">
        <div class="rsvp-section__heading reveal">
          <span class="section-eyebrow">RSVP</span>
          <h2 id="rsvpTitle">Xác nhận tham dự</h2>
          <p class="rsvp-section__subtitle" id="rsvpSubtitle"></p>
        </div>

        <form id="rsvpForm" class="rsvp-form reveal">
          <div class="rsvp-form__row">
            <label class="rsvp-form__field">
              <span>Họ và tên <em>*</em></span>
              <input type="text" name="name" id="rsvpName" autocomplete="name" required />
            </label>
            <label class="rsvp-form__field">
              <span>Số điện thoại <em>*</em></span>
              <input type="tel" name="phone" id="rsvpPhone" autocomplete="tel" required />
            </label>
          </div>

          <div class="rsvp-form__row">
            <label class="rsvp-form__field">
              <span>Bạn có tham dự không? <em>*</em></span>
              <select name="attending" id="rsvpAttending" required>
                <option value="" disabled selected>-- Chọn --</option>
                <option value="yes" id="rsvpAttendingYesOption">Có, tôi sẽ tham dự</option>
                <option value="no" id="rsvpAttendingNoOption">Rất tiếc, tôi không thể tham dự</option>
              </select>
            </label>
            <label class="rsvp-form__field" id="rsvpGuestsField">
              <span>Số lượng khách</span>
              <input type="number" name="guests" id="rsvpGuests" min="1" max="10" value="1" />
            </label>
          </div>

          <label class="rsvp-form__field">
            <span>Lời chúc gửi đến cô dâu chú rể</span>
            <textarea name="message" id="rsvpMessage" rows="4" maxlength="500"></textarea>
          </label>

          <button type="submit" class="rsvp-form__submit" id="rsvpSubmitBtn">
            <span id="rsvpSubmitLabel">Gửi xác nhận</span>
          </button>

          <p class="rsvp-form__status" id="rsvpStatus" role="status" aria-live="polite" hidden></p>
        </form>
      </div>
    </section>

    <!-- TODO (M7): Mừng cưới -->
    <!-- TODO (M8): Lời chúc -->
    <!-- TODO (M9): Footer + Nhạc nền + Hoa rơi -->
  </main>

  <!-- ==========================================================
       BACK TO TOP
  =========================================================== -->
  <button id="backToTop" class="back-to-top" type="button" aria-label="Lên đầu trang">&uarr;</button>

  <!-- ==========================================================
       LIGHTBOX (M5) — overlay dùng chung cho Album ảnh
  =========================================================== -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh phóng to" hidden>
    <button id="lightboxClose" class="lightbox__close" type="button" aria-label="Đóng">&times;</button>
    <button id="lightboxPrev" class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Ảnh trước">&#8249;</button>
    <img id="lightboxImage" class="lightbox__image" alt="" />
    <button id="lightboxNext" class="lightbox__nav lightbox__nav--next" type="button" aria-label="Ảnh sau">&#8250;</button>
    <p class="lightbox__counter" id="lightboxCounter"></p>
  </div>

  <!-- config.js phải load TRƯỚC script.js vì script.js đọc WEDDING_CONFIG -->
  <script src="config.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
